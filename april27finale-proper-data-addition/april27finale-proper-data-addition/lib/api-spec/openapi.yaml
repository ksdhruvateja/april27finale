openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: QuickBooks-style business platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard operations
  - name: customers
    description: Customer operations
  - name: vendors
    description: Vendor operations
  - name: products
    description: Product operations
  - name: quotes
    description: Quote operations
  - name: estimates
    description: Estimate operations
  - name: invoices
    description: Invoice operations
  - name: bills
    description: Bill operations
  - name: purchase-orders
    description: Purchase order operations
  - name: inventory
    description: Inventory operations
  - name: shipments
    description: Shipment operations
  - name: tax-rates
    description: Tax rate operations
  - name: sales-leads
    description: Sales lead operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

